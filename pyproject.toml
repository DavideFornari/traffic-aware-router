[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-aware-router"
version = "0.1.0"
description = "A router that computes traffic-aware shortest paths on a real road network."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Davide Fornari" }]

# Runtime dependencies are added milestone by milestone, alongside the code
# that first needs them, so `make venv` stays fast and failures stay scoped.
dependencies = [
    "osmnx>=1.9",
    "networkx>=3.2",
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "pre-commit>=3",
]
# Standalone map rendering for debug scripts; the Streamlit UI's
# streamlit-folium (below) depends on this same folium package. matplotlib
# is only for static plots (e.g. scripts/generate_screenshot.py).
viz = [
    "folium>=0.15",
    "matplotlib>=3.8",
]
app = [
    "streamlit>=1.35",
    "streamlit-folium>=0.20",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
